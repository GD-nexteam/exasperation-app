name: Déploiement sécurisé vers GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
        
      - name: Injecter les Secrets Firebase
        run: |
          sed -i "s/TON_API_KEY/${{ secrets.FIREBASE_API_KEY }}/g" index.html
          sed -i "s/TON_PROJET/${{ secrets.FIREBASE_PROJECT_ID }}/g" index.html
          sed -i "s/TON_SENDER_ID/${{ secrets.FIREBASE_SENDER_ID }}/g" index.html
          sed -i "s/TON_APP_ID/${{ secrets.FIREBASE_APP_ID }}/g" index.html
          
      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v4
        
      - name: Préparer les fichiers
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
          
      - name: Déployer sur le site en ligne
        id: deployment
        uses: actions/deploy-pages@v4
